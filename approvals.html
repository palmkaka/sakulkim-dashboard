    <!-- Favicon -->

    <style>
        .approval-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            margin-bottom: var(--space-4);
            transition: all var(--transition-fast);
        }

        .approval-card:hover {
            border-color: var(--border-medium);
            box-shadow: var(--shadow-lg);
        }

        .approval-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-4);
        }

        .approval-type {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
        }

        .approval-amount {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
        }

        .approval-amount.positive {
            color: var(--success);
        }

        .approval-amount.negative {
            color: var(--error);
        }

        .approval-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-4);
            padding: var(--space-4);
            background: var(--bg-tertiary);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
        }

        .approval-detail-item {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .approval-detail-label {
            font-size: var(--text-xs);
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .approval-detail-value {
            font-size: var(--text-sm);
            color: var(--text-primary);
        }

        .approval-actions {
            display: flex;
            gap: var(--space-3);
            justify-content: flex-end;
        }

        .attachment-preview {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3);
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
        }

        .attachment-preview img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: var(--radius-md);
        }

        @media (max-width: 768px) {
            .approval-details {
                grid-template-columns: 1fr;
            }

            .approval-actions {
                flex-direction: column;
            }

            .approval-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>

    <!-- App Scripts -->

    <script src="js/auth.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = null;
        let pendingEntries = [];

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await auth.loadUserProfile(user.uid);

            // Check if user can approve
            if (!auth.canApprove()) {
                window.location.href = 'dashboard.html';
                return;
            }

            updateUserUI();
            setupNavigation();
            loadPendingEntries();
        });

        function updateUserUI() {
            const profile = auth.getUserProfile();
            document.getElementById('userName').textContent = profile?.displayName || profile?.email || 'User';
            document.getElementById('userRole').textContent = auth.getRoleDisplayName('th');
            document.getElementById('userAvatar').textContent = auth.getInitials();
        }

        function setupNavigation() {
            const adminSection = document.getElementById('adminSection');
            if (adminSection) {
                adminSection.style.display = auth.canManageUsers() ? 'block' : 'none';
            }
        }

        function loadPendingEntries() {
            // Load from Firestore
            db.collection('entries')
                .where('status', '==', 'pending')
                .orderBy('submittedAt', 'desc')
                .onSnapshot(snapshot => {
                    pendingEntries = [];
                    snapshot.forEach(doc => {
                        pendingEntries.push({ id: doc.id, ...doc.data() });
                    });
                    document.getElementById('pendingCount').textContent = pendingEntries.length;
                    renderPendingEntries();
                }, error => {
                    console.error('Error loading entries:', error);
                });
        }

        function renderPendingEntries() {
            const container = document.getElementById('pendingList');

            if (pendingEntries.length === 0) {
                container.innerHTML = `
          <div class="text-center p-12 text-muted">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto var(--space-4); color: var(--success);">
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <h3 class="text-xl font-semibold mb-2" style="color: var(--success);">ยอดเยี่ยม!</h3>
            <p class="text-muted">ไม่มีรายการรออนุมัติ ทุกอย่างได้รับการตรวจสอบแล้ว</p>
          </div>
        `;
                return;
            }

            container.innerHTML = pendingEntries.map(entry => {
                const typeEmoji = entry.type === 'revenue' ? '💰' : entry.type === 'expense' ? '💸' : '🚗';
                const typeLabel = entry.type === 'revenue' ? 'รายได้' : entry.type === 'expense' ? 'ค่าใช้จ่าย' : 'เที่ยวรถ';
                const amount = entry.amount || entry.revenue || 0;
                const amountClass = entry.type === 'expense' ? 'negative' : 'positive';

                return `
          <div class="approval-card" id="entry-${entry.id}">
            <div class="approval-header">
              <div>
                <div class="approval-type">${typeEmoji} ${typeLabel}</div>
                <p class="text-muted text-sm mt-1">${entry.description || 'ไม่มีคำอธิบาย'}</p>
              </div>
              <div class="approval-amount ${amountClass}">฿${amount.toLocaleString()}</div>
            </div>
            
            <div class="approval-details">
              <div class="approval-detail-item">
                <span class="approval-detail-label">วันที่</span>
                <span class="approval-detail-value">${formatDate(entry.date)}</span>
              </div>
              <div class="approval-detail-item">
                <span class="approval-detail-label">ส่งโดย</span>
                <span class="approval-detail-value">${entry.submittedBy}</span>
              </div>
              <div class="approval-detail-item">
                <span class="approval-detail-label">เวลาที่ส่ง</span>
                <span class="approval-detail-value">${formatDateTime(entry.submittedAt)}</span>
              </div>
              ${entry.type === 'trip' ? `
              <div class="approval-detail-item">
                <span class="approval-detail-label">เส้นทาง</span>
                <span class="approval-detail-value">${entry.origin} → ${entry.destination}</span>
              </div>
              ` : `
              <div class="approval-detail-item">
                <span class="approval-detail-label">หมวดหมู่</span>
                <span class="approval-detail-value">${getCategoryLabel(entry.category)}</span>
              </div>
              `}
            </div>
            
            <div class="approval-actions">
              <button class="btn btn-danger" onclick="rejectEntry('${entry.id}')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                ปฏิเสธ
              </button>
              <button class="btn btn-primary" onclick="approveEntry('${entry.id}')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                อนุมัติ
              </button>
            </div>
          </div>
        `;
            }).join('');
        }

        function approveEntry(entryId) {
            if (!confirm('ยืนยันการอนุมัติรายการนี้?')) return;

            updateEntryStatus(entryId, 'approved');
            showToast('อนุมัติรายการเรียบร้อย', 'success');
        }

        function rejectEntry(entryId) {
            const reason = prompt('เหตุผลในการปฏิเสธ (ถ้ามี):');
            if (reason === null) return; // Cancelled

            updateEntryStatus(entryId, 'rejected', reason);
            showToast('ปฏิเสธรายการเรียบร้อย', 'info');
        }

        async function updateEntryStatus(entryId, status, reason = '') {
            try {
                const updateData = {
                    status: status,
                    reviewedBy: currentUser.email,
                    reviewedAt: new Date().toISOString()
                };
                if (reason) updateData.rejectReason = reason;

                await db.collection('entries').doc(entryId).update(updateData);

                // Animate removal
                const card = document.getElementById(`entry-${entryId}`);
                if (card) {
                    card.style.transition = 'all 0.3s ease';
                    card.style.opacity = '0';
                    card.style.transform = 'translateX(100px)';
                }
            } catch (error) {
                console.error('Error updating entry:', error);
                showToast('เกิดข้อผิดพลาด', 'error');
            }
        }

        function showToast(message, type = 'info') {
            // Simple toast notification
            const toast = document.createElement('div');
            toast.className = `alert alert-${type === 'success' ? 'success' : 'info'}`;
            toast.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 1000; animation: fadeInUp 0.3s ease;';
            toast.innerHTML = `<span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeInUp 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('th-TH', {
                day: 'numeric',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getCategoryLabel(category) {
            const labels = {
                'product_sales': 'ขายสินค้า',
                'delivery_fee': 'ค่าจัดส่ง',
                'other_income': 'รายได้อื่น',
                'employee': 'พนักงาน',
                'donation': 'บริจาคและรอมาฎอน',
                'advertising': 'ค่าโฆษณาและส่งเสริม',
                'depreciation': 'ค่าเสื่อมราคา',
                'tax': 'ภาษีและอากร',
                'general': 'บริการทั่วไป',
                'other_expense': 'ค่าใช้จ่ายอื่น'
            };
            return labels[category] || category || '-';
        }

        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            document.querySelector('.sun-icon').classList.toggle('hidden');
            document.querySelector('.moon-icon').classList.toggle('hidden');
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'light') {
            document.querySelector('.sun-icon').classList.add('hidden');
            document.querySelector('.moon-icon').classList.remove('hidden');
        }

        // Sidebar Toggle
        document.getElementById('sidebarToggle')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        });
        document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });

        // Logout
        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            await firebase.auth().signOut();
            window.location.href = 'index.html';
        });

        // User dropdown
        document.getElementById('userDropdown')?.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('userDropdown').classList.toggle('active');
        });
        document.addEventListener('click', () => {
            document.getElementById('userDropdown')?.classList.remove('active');
        });
    </script>
</body>

</html>
