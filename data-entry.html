<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">

    <style>
        .entry-type-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }

        .entry-type-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-4);
            background: var(--bg-tertiary);
            border: 2px solid transparent;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .entry-type-btn:hover {
            background: var(--bg-card-hover);
        }

        .entry-type-btn.active {
            border-color: var(--primary-500);
            background: rgba(16, 185, 129, 0.1);
        }

        .entry-type-btn.active.expense {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .entry-type-btn.active.trip {
            border-color: var(--secondary-500);
            background: rgba(59, 130, 246, 0.1);
        }

        .entry-type-btn svg {
            width: 24px;
            height: 24px;
            color: var(--text-muted);
        }

        .entry-type-btn.active svg {
            color: var(--primary-500);
        }

        .entry-type-btn.active.expense svg {
            color: var(--error);
        }

        .entry-type-btn.active.trip svg {
            color: var(--secondary-500);
        }

        .entry-type-btn span {
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--text-secondary);
        }

        .entry-type-btn.active span {
            color: var(--primary-500);
        }

        .entry-type-btn.active.expense span {
            color: var(--error);
        }

        .entry-type-btn.active.trip span {
            color: var(--secondary-500);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-4);
        }

        @media (max-width: 768px) {
            .entry-type-selector {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .file-upload {
            border: 2px dashed var(--border-medium);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .file-upload:hover {
            border-color: var(--primary-500);
            background: rgba(16, 185, 129, 0.05);
        }

        .file-upload.dragover {
            border-color: var(--primary-500);
            background: rgba(16, 185, 129, 0.1);
        }

        .file-preview {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3);
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            margin-top: var(--space-3);
        }

        .file-preview img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: var(--radius-md);
        }

        .recent-entries {
            margin-top: var(--space-8);
        }
    </style>
</head>

                        </div>

                        <form id="entryForm">

                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"

                            </div>

                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">ต้นทาง *</label>
                                        <input type="text" class="form-input" id="origin" placeholder="กรุงเทพ">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">ปลายทาง *</label>
                                        <input type="text" class="form-input" id="destination" placeholder="เชียงใหม่">
                                    </div>
                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">ค่าน้ำมัน (บาท)</label>

                                    </svg>

    <!-- Firebase SDK -->

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentUser = null;
        let selectedType = 'revenue';
        let selectedFile = null;

        // Auth check
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await auth.loadUserProfile(user.uid);
            updateUserUI();

            // Set default date to today
            document.getElementById('entryDate').valueAsDate = new Date();
            document.getElementById('tripDate').valueAsDate = new Date();
        });

        function updateUserUI() {
            const profile = auth.getUserProfile();
            document.getElementById('userName').textContent = profile?.displayName || profile?.email || 'User';
            document.getElementById('userRole').textContent = auth.getRoleDisplayName('th');
            document.getElementById('userAvatar').textContent = auth.getInitials();
        }

        // Entry Type Selection
        const typeBtns = document.querySelectorAll('.entry-type-btn');
        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedType = btn.dataset.type;

                updateCategoryOptions();
                toggleFields();
            });
        });

        function toggleFields() {
            const standardFields = document.getElementById('standardFields');
            const tripFields = document.getElementById('tripFields');

            if (selectedType === 'trip') {
                standardFields.classList.add('hidden');
                tripFields.classList.remove('hidden');
            } else {
                standardFields.classList.remove('hidden');
                tripFields.classList.add('hidden');
            }
        }

        function updateCategoryOptions() {
            const categorySelect = document.getElementById('category');

            const categories = {
                revenue: [
                    { value: 'product_sales', label: 'ขายสินค้า' },
                    { value: 'delivery_fee', label: 'ค่าจัดส่ง' },
                    { value: 'other_income', label: 'รายได้อื่น' }
                ],
                expense: [
                    { value: 'employee', label: 'พนักงาน' },
                    { value: 'donation', label: 'บริจาคและรอมาฎอน' },
                    { value: 'advertising', label: 'ค่าโฆษณาและส่งเสริม' },
                    { value: 'depreciation', label: 'ค่าเสื่อมราคา' },
                    { value: 'tax', label: 'ภาษีและอากร' },
                    { value: 'general', label: 'บริการทั่วไป' },
                    { value: 'other_expense', label: 'ค่าใช้จ่ายอื่น' }
                ]
            };

            if (selectedType === 'trip') return;

            const options = categories[selectedType] || [];
            categorySelect.innerHTML = '<option value="">เลือกหมวดหมู่</option>' +
                options.map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('');
        }

        // File Upload
        const fileUpload = document.getElementById('fileUpload');
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');

        fileUpload.addEventListener('click', () => fileInput.click());
        fileUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUpload.classList.add('dragover');
        });
        fileUpload.addEventListener('dragleave', () => {
            fileUpload.classList.remove('dragover');
        });
        fileUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUpload.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            if (file.size > 5 * 1024 * 1024) {
                alert('ไฟล์มีขนาดใหญ่เกินไป (สูงสุด 5MB)');
                return;
            }

            selectedFile = file;
            filePreview.classList.remove('hidden');

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    filePreview.innerHTML = `
            <div class="file-preview">
              <img src="${e.target.result}" alt="Preview">
              <div>
                <p class="text-sm font-medium">${file.name}</p>
                <p class="text-xs text-muted">${(file.size / 1024).toFixed(1)} KB</p>
              </div>
              <button type="button" class="btn btn-sm btn-ghost" onclick="removeFile()">✕</button>
            </div>
          `;
                };
                reader.readAsDataURL(file);
            } else {
                filePreview.innerHTML = `
          <div class="file-preview">
            <div style="width: 48px; height: 48px; background: var(--bg-tertiary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;">
              📄
            </div>
            <div>
              <p class="text-sm font-medium">${file.name}</p>
              <p class="text-xs text-muted">${(file.size / 1024).toFixed(1)} KB</p>
            </div>
            <button type="button" class="btn btn-sm btn-ghost" onclick="removeFile()">✕</button>
          </div>
        `;
            }
        }

        function removeFile() {
            selectedFile = null;
            fileInput.value = '';
            filePreview.classList.add('hidden');
            filePreview.innerHTML = '';
        }

        // Form Submit
        document.getElementById('entryForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const submitSpinner = document.getElementById('submitSpinner');

            submitBtn.disabled = true;
            submitSpinner.classList.remove('hidden');

            try {
                // Upload file if exists
                let fileUrl = null;
                if (selectedFile) {
                    const storageRef = storage.ref(`receipts/${Date.now()}_${selectedFile.name}`);
                    const snapshot = await storageRef.put(selectedFile);
                    fileUrl = await snapshot.ref.getDownloadURL();
                }

                const entryData = {
                    type: selectedType,
                    submittedBy: currentUser.email,
                    submittedAt: new Date().toISOString(),
                    status: 'pending'
                };

                if (fileUrl) entryData.fileUrl = fileUrl;

                if (selectedType === 'trip') {
                    entryData.date = document.getElementById('tripDate').value;
                    entryData.vehicleNo = document.getElementById('vehicleNo').value;
                    entryData.origin = document.getElementById('origin').value;
                    entryData.destination = document.getElementById('destination').value;
                    entryData.fuelCost = parseFloat(document.getElementById('fuelCost').value) || 0;
                    entryData.revenue = parseFloat(document.getElementById('tripRevenue').value) || 0;
                } else {
                    entryData.category = document.getElementById('category').value;
                    entryData.date = document.getElementById('entryDate').value;
                    entryData.amount = parseFloat(document.getElementById('amount').value);
                }

                entryData.description = document.getElementById('description').value;

                // Save to Firestore
                await db.collection('entries').add(entryData);

                // Show success
                alert('บันทึกข้อมูลสำเร็จ! รอการอนุมัติ');
                resetForm();
                loadRecentEntries();

            } catch (error) {
                console.error('Error submitting entry:', error);
                alert('เกิดข้อผิดพลาด: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitSpinner.classList.add('hidden');
            }
        });

        function resetForm() {
            document.getElementById('entryForm').reset();
            document.getElementById('entryDate').valueAsDate = new Date();
            document.getElementById('tripDate').valueAsDate = new Date();
            removeFile();
        }

        function loadRecentEntries() {
            const entries = JSON.parse(localStorage.getItem('pendingEntries') || '[]')
                .filter(e => e.submittedBy === currentUser?.email)
                .slice(0, 5);

            const container = document.getElementById('recentEntriesList');

            if (entries.length === 0) {
                container.innerHTML = '<div class="text-center p-6 text-muted"><p>ยังไม่มีรายการ</p></div>';
                return;
            }

            container.innerHTML = entries.map(entry => {
                const statusColor = entry.status === 'approved' ? 'success' : entry.status === 'rejected' ? 'danger' : 'warning';
                const statusLabel = entry.status === 'approved' ? 'อนุมัติแล้ว' : entry.status === 'rejected' ? 'ปฏิเสธ' : 'รอตรวจสอบ';
                const typeLabel = entry.type === 'revenue' ? '💰 รายได้' : entry.type === 'expense' ? '💸 ค่าใช้จ่าย' : '🚗 เที่ยวรถ';
                const amount = entry.amount || entry.revenue || 0;

                return `
          <div class="flex justify-between items-center p-4 border-b" style="border-color: var(--border-light);">
            <div>
              <p class="font-medium">${typeLabel}</p>
              <p class="text-sm text-muted">${entry.date}</p>
            </div>
            <div class="text-right">
              <p class="font-semibold">฿${amount.toLocaleString()}</p>
              <span class="badge badge-${statusColor}">${statusLabel}</span>
            </div>
          </div>
        `;
            }).join('');
        }

        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const sunIcon = document.querySelector('.sun-icon');
            const moonIcon = document.querySelector('.moon-icon');
            sunIcon.classList.toggle('hidden');
            moonIcon.classList.toggle('hidden');
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'light') {
            document.querySelector('.sun-icon').classList.add('hidden');
            document.querySelector('.moon-icon').classList.remove('hidden');
        }

        // Sidebar Toggle
        document.getElementById('sidebarToggle')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        });
        document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });

        // Logout
        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            await firebase.auth().signOut();
            window.location.href = 'index.html';
        });

        // User dropdown
        document.getElementById('userDropdown')?.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('userDropdown').classList.toggle('active');
        });
        document.addEventListener('click', () => {
            document.getElementById('userDropdown')?.classList.remove('active');
        });

        // Load recent entries on page load
        setTimeout(loadRecentEntries, 100);
    </script>
</body>

</html>
