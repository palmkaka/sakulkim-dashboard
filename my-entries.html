<!DOCTYPE html>
<html lang="th" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="สกุลกิม Dashboard - รายการของฉัน">
    <title>รายการของฉัน | สกุลกิม Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">

    <style>
        .entry-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
            transition: all var(--transition-fast);
        }

        .entry-card:hover {
            border-color: var(--border-medium);
        }

        .entry-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-3);
        }

        .entry-type-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
        }

        .entry-type-badge.revenue {
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary-400);
        }

        .entry-type-badge.expense {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .entry-type-badge.trip {
            background: rgba(59, 130, 246, 0.15);
            color: var(--secondary-400);
        }

        .entry-amount {
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
        }

        .entry-amount.positive {
            color: var(--success);
        }

        .entry-amount.negative {
            color: var(--error);
        }

        .entry-meta {
            display: flex;
            gap: var(--space-4);
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        .entry-meta span {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        .filter-tabs {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-6);
        }

        .filter-tab {
            padding: var(--space-2) var(--space-4);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .filter-tab:hover {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .filter-tab.active {
            background: var(--primary-500);
            border-color: var(--primary-500);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: var(--space-12);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--text-muted);
            margin-bottom: var(--space-4);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
        }

        .mini-stat {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            text-align: center;
        }

        .mini-stat-value {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--text-primary);
        }

        .mini-stat-label {
            font-size: var(--text-sm);
            color: var(--text-muted);
            margin-top: var(--space-1);
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="20" x2="12" y2="10"></line>
                            <line x1="18" y1="20" x2="18" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="16"></line>
                        </svg>
                    </div>
                    <span class="sidebar-logo-text">สกุล<span>กิม</span></span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">เมนูหลัก</div>
                    <a href="dashboard.html" class="nav-item" id="navDashboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="9"></rect>
                            <rect x="14" y="3" width="7" height="5"></rect>
                            <rect x="14" y="12" width="7" height="9"></rect>
                            <rect x="3" y="16" width="7" height="5"></rect>
                        </svg>
                        <span>แดชบอร์ด</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">จัดการข้อมูล</div>
                    <a href="data-entry.html" class="nav-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>เพิ่มข้อมูล</span>
                    </a>
                    <a href="my-entries.html" class="nav-item active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span>รายการของฉัน</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user dropdown" id="userDropdown">
                    <div class="avatar" id="userAvatar">SK</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="userName">Loading...</div>
                        <div class="sidebar-user-role" id="userRole">-</div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>

                    <div class="dropdown-menu">
                        <div class="dropdown-item" id="logoutBtn" style="color: var(--error);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span>ออกจากระบบ</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="header-toggle" id="sidebarToggle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h1 class="header-title" data-i18n="nav.my_entries">รายการของฉัน</h1>
                </div>
                <div class="header-right">
                    <div class="lang-toggle">
                        <button class="lang-btn active" data-lang="th">TH</button>
                        <button class="lang-btn" data-lang="en">EN</button>
                    </div>
                    <button class="theme-toggle" id="themeToggle">
                        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <!-- Stats Row -->
                <div class="stats-row">
                    <div class="mini-stat">
                        <div class="mini-stat-value" id="totalEntries">0</div>
                        <div class="mini-stat-label" data-i18n="common.all">รายการทั้งหมด</div>
                    </div>
                    <div class="mini-stat">
                        <div class="mini-stat-value" id="pendingEntries" style="color: var(--warning);">0</div>
                        <div class="mini-stat-label" data-i18n="approvals.pending">รอตรวจสอบ</div>
                    </div>
                    <div class="mini-stat">
                        <div class="mini-stat-value" id="approvedEntries" style="color: var(--success);">0</div>
                        <div class="mini-stat-label" data-i18n="approvals.approved">อนุมัติแล้ว</div>
                    </div>
                </div>

                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all" data-i18n="common.all">ทั้งหมด</button>
                    <button class="filter-tab" data-filter="pending" data-i18n="approvals.pending">รอตรวจสอบ</button>
                    <button class="filter-tab" data-filter="approved"
                        data-i18n="approvals.approved">อนุมัติแล้ว</button>
                    <button class="filter-tab" data-filter="rejected" data-i18n="approvals.rejected">ปฏิเสธ</button>
                </div>

                <!-- Entries List -->
                <div id="entriesList">
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="12" y1="18" x2="12" y2="12"></line>
                            <line x1="9" y1="15" x2="15" y2="15"></line>
                        </svg>
                        <h3 class="text-xl font-semibold mb-2">ยังไม่มีรายการ</h3>
                        <p class="text-muted mb-4">เริ่มเพิ่มข้อมูลใหม่ได้เลย</p>
                        <a href="data-entry.html" class="btn btn-primary">➕ เพิ่มข้อมูล</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);

        let currentUser = null;
        let currentFilter = 'all';
        let allEntries = [];

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await auth.loadUserProfile(user.uid);
            updateUserUI();
            setupNavigation();
            loadEntries();
        });

        function updateUserUI() {
            const profile = auth.getUserProfile();
            document.getElementById('userName').textContent = profile?.displayName || profile?.email || 'User';
            document.getElementById('userRole').textContent = auth.getRoleDisplayName('th');
            document.getElementById('userAvatar').textContent = auth.getInitials();
        }

        function setupNavigation() {
            // Show/hide dashboard link based on role
            const navDashboard = document.getElementById('navDashboard');
            if (navDashboard) {
                navDashboard.style.display = auth.canViewDashboard() ? 'flex' : 'none';
            }
        }

        function loadEntries() {
            // Load from Firestore with real-time updates
            const db = firebase.firestore();
            db.collection('entries')
                .where('submittedBy', '==', currentUser?.email)
                .orderBy('submittedAt', 'desc')
                .onSnapshot(snapshot => {
                    allEntries = [];
                    snapshot.forEach(doc => {
                        allEntries.push({ id: doc.id, ...doc.data() });
                    });
                    updateStats();
                    renderEntries();
                }, error => {
                    console.error('Error loading entries:', error);
                    // Fallback to empty array
                    allEntries = [];
                    updateStats();
                    renderEntries();
                });
        }


        function updateStats() {
            const total = allEntries.length;
            const pending = allEntries.filter(e => e.status === 'pending').length;
            const approved = allEntries.filter(e => e.status === 'approved').length;

            document.getElementById('totalEntries').textContent = total;
            document.getElementById('pendingEntries').textContent = pending;
            document.getElementById('approvedEntries').textContent = approved;
        }

        function renderEntries() {
            const container = document.getElementById('entriesList');

            let filtered = allEntries;
            if (currentFilter !== 'all') {
                filtered = allEntries.filter(e => e.status === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <h3 class="text-xl font-semibold mb-2">ไม่มีรายการ</h3>
            <p class="text-muted mb-4">${currentFilter === 'all' ? 'เริ่มเพิ่มข้อมูลใหม่ได้เลย' : 'ไม่มีรายการในหมวดนี้'}</p>
            <a href="data-entry.html" class="btn btn-primary">➕ เพิ่มข้อมูล</a>
          </div>
        `;
                return;
            }

            container.innerHTML = filtered.map(entry => {
                const typeClass = entry.type === 'revenue' ? 'revenue' : entry.type === 'expense' ? 'expense' : 'trip';
                const typeLabel = entry.type === 'revenue' ? '💰 รายได้' : entry.type === 'expense' ? '💸 ค่าใช้จ่าย' : '🚗 เที่ยวรถ';
                const amount = entry.amount || entry.revenue || 0;
                const amountClass = entry.type === 'expense' ? 'negative' : 'positive';
                const amountPrefix = entry.type === 'expense' ? '-' : '+';

                const statusBadge = {
                    pending: '<span class="badge badge-warning">⏳ รอตรวจสอบ</span>',
                    approved: '<span class="badge badge-success">✅ อนุมัติแล้ว</span>',
                    rejected: '<span class="badge badge-danger">❌ ปฏิเสธ</span>'
                }[entry.status] || '';

                // Show delete button only for pending entries
                const deleteBtn = entry.status === 'pending'
                    ? `<button class="btn btn-sm btn-danger" onclick="deleteEntry('${entry.id}')" style="margin-left: 8px;">🗑️</button>`
                    : '';

                return `
          <div class="entry-card">
            <div class="entry-card-header">
              <div>
                <span class="entry-type-badge ${typeClass}">${typeLabel}</span>
                <p class="text-sm text-muted mt-2">${entry.description || 'ไม่มีคำอธิบาย'}</p>
              </div>
              <div class="text-right" style="display: flex; align-items: center; gap: 8px;">
                <div>
                  <div class="entry-amount ${amountClass}">${amountPrefix}฿${amount.toLocaleString()}</div>
                  ${statusBadge}
                </div>
                ${deleteBtn}
              </div>
            </div>
            <div class="entry-meta">
              <span>📅 ${formatDate(entry.date)}</span>
              <span>🕐 ${formatTime(entry.submittedAt)}</span>
              ${entry.type === 'trip' ? `<span>🚗 ${entry.origin} → ${entry.destination}</span>` : ''}
            </div>
          </div>
        `;
            }).join('');
        }

        async function deleteEntry(entryId) {
            if (!confirm('คุณแน่ใจหรือไม่ที่จะลบรายการนี้?')) {
                return;
            }

            try {
                const db = firebase.firestore();
                await db.collection('entries').doc(entryId).delete();
                // Real-time listener will update automatically
            } catch (error) {
                console.error('Error deleting entry:', error);
                alert('เกิดข้อผิดพลาด: ' + error.message);
            }
        }


        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function formatTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        }

        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderEntries();
            });
        });

        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            document.querySelector('.sun-icon').classList.toggle('hidden');
            document.querySelector('.moon-icon').classList.toggle('hidden');
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'light') {
            document.querySelector('.sun-icon').classList.add('hidden');
            document.querySelector('.moon-icon').classList.remove('hidden');
        }

        // Sidebar Toggle
        document.getElementById('sidebarToggle')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        });
        document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });

        // Logout
        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            await firebase.auth().signOut();
            window.location.href = 'index.html';
        });

        // User dropdown
        document.getElementById('userDropdown')?.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('userDropdown').classList.toggle('active');
        });
        document.addEventListener('click', () => {
            document.getElementById('userDropdown')?.classList.remove('active');
        });
    </script>
</body>

</html>
