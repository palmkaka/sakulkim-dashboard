<!DOCTYPE html>
<html lang="th" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="สกุลกิม Dashboard - ระบบจัดการข้อมูลทางการเงิน">
  <title>เข้าสู่ระบบ | สกุลกิม Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>

<body>
  <div class="auth-layout">
    <!-- Auth Card -->
    <div class="auth-card">
      <!-- Theme & Language Toggle -->
      <div class="auth-options">
        <div class="lang-toggle">
          <button class="lang-btn active" data-lang="th">TH</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="theme-toggle" id="themeToggle" title="สลับธีม">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="10"></line>
            <line x1="18" y1="20" x2="18" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="16"></line>
          </svg>
        </div>
        <h1 class="auth-title" data-i18n="auth.welcome_back">ยินดีต้อนรับกลับ</h1>
        <p class="auth-subtitle" data-i18n="app.tagline">ระบบจัดการข้อมูลทางการเงิน</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="email" data-i18n="auth.email">อีเมล</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          <p class="form-error hidden" id="emailError"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <span data-i18n="auth.password">รหัสผ่าน</span>
          </label>
          <div class="password-input-wrapper" style="position: relative;">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required
              autocomplete="current-password" minlength="6">
            <button type="button" class="password-toggle" id="passwordToggle"
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <p class="form-error hidden" id="passwordError"></p>
        </div>

        <div class="flex justify-between items-center mb-6">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <span class="form-check-label">จดจำฉัน</span>
          </label>
          <a href="#" class="text-sm text-primary-400" data-i18n="auth.forgot_password">ลืมรหัสผ่าน?</a>
        </div>

        <!-- Alert for errors -->
        <div class="alert alert-error hidden mb-4" id="loginError">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="loginErrorText"></span>
        </div>

        <button type="submit" class="btn btn-primary w-full" id="loginBtn">
          <span data-i18n="auth.login">เข้าสู่ระบบ</span>
          <div class="spinner spinner-sm hidden" id="loginSpinner"></div>
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span data-i18n="auth.or">หรือ</span>
      </div>

      <!-- Google Sign In -->
      <button type="button" class="btn btn-outline w-full" id="googleSignIn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        <span data-i18n="auth.login_with_google">เข้าสู่ระบบด้วย Google</span>
      </button>

      <!-- Footer -->
      <div class="auth-footer">
        <span data-i18n="auth.no_account">ยังไม่มีบัญชี?</span>
        <a href="register.html" data-i18n="auth.register">สมัครสมาชิก</a>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Save user to Firestore function
    async function saveUserToFirestore(user) {
      const userRef = db.collection('users').doc(user.uid);
      const doc = await userRef.get();
      if (!doc.exists) {
        // New user - create profile
        await userRef.set({
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || user.email.split('@')[0],
          role: 'customer',
          createdAt: new Date().toISOString()
        });
      }
      // Also save to localStorage for offline support
      const profile = doc.exists ? doc.data() : { uid: user.uid, email: user.email, displayName: user.displayName, role: 'customer' };
      localStorage.setItem(`user_${user.uid}`, JSON.stringify(profile));
    }

    // Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const sunIcon = themeToggle.querySelector('.sun-icon');
    const moonIcon = themeToggle.querySelector('.moon-icon');

    // Load saved theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    updateThemeIcons(savedTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcons(newTheme);
    });

    function updateThemeIcons(theme) {
      if (theme === 'dark') {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }

    // Password Toggle
    const passwordToggle = document.getElementById('passwordToggle');
    const passwordInput = document.getElementById('password');
    const eyeIcon = passwordToggle.querySelector('.eye-icon');
    const eyeOffIcon = passwordToggle.querySelector('.eye-off-icon');

    passwordToggle.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeIcon.classList.toggle('hidden');
      eyeOffIcon.classList.toggle('hidden');
    });

    // Login Form
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginSpinner = document.getElementById('loginSpinner');
    const loginError = document.getElementById('loginError');
    const loginErrorText = document.getElementById('loginErrorText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Show loading
      loginBtn.disabled = true;
      loginSpinner.classList.remove('hidden');
      loginError.classList.add('hidden');

      try {
        const result = await firebase.auth().signInWithEmailAndPassword(email, password);
        await saveUserToFirestore(result.user);
        // Redirect to dashboard
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error('Login error:', error);
        loginError.classList.remove('hidden');
        loginErrorText.textContent = getErrorMessage(error.code);
      } finally {
        loginBtn.disabled = false;
        loginSpinner.classList.add('hidden');
      }
    });

    // Google Sign In
    const googleSignIn = document.getElementById('googleSignIn');
    googleSignIn.addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        await saveUserToFirestore(result.user);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error('Google sign in error:', error);
        loginError.classList.remove('hidden');
        loginErrorText.textContent = getErrorMessage(error.code);
      }
    });

    // Error messages
    function getErrorMessage(code) {
      const messages = {
        'auth/invalid-email': 'อีเมลไม่ถูกต้อง',
        'auth/user-disabled': 'บัญชีนี้ถูกระงับ',
        'auth/user-not-found': 'ไม่พบบัญชีนี้',
        'auth/wrong-password': 'รหัสผ่านไม่ถูกต้อง',
        'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
        'auth/too-many-requests': 'มีการลองเข้าสู่ระบบมากเกินไป กรุณาลองใหม่ภายหลัง',
        'auth/popup-closed-by-user': 'การเข้าสู่ระบบถูกยกเลิก'
      };
      return messages[code] || 'เกิดข้อผิดพลาด กรุณาลองใหม่';
    }

    // Check if already logged in
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    // Language Toggle
    const langBtns = document.querySelectorAll('.lang-btn');
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const lang = btn.getAttribute('data-lang');
        if (typeof i18n !== 'undefined') {
          i18n.setLanguage(lang);
        }
      });
    });
  </script>
</body>

</html>
